<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T&L Report</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#202a36;
  --muted:#687482;
  --accent:#284f73;
  --accent-strong:#1f425f;
  --accent-ink:#ffffff;
  --accent-soft:#e9f0f5;
  --border:#d9e0e7;
  --border-strong:#c8d1da;
  --danger:#a94343;
  --success:#39735b;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{
  --bg:#151a20;
  --card:#1d242c;
  --ink:#edf1f4;
  --muted:#9ba6b2;
  --accent:#6f9abb;
  --accent-strong:#83a9c7;
  --accent-ink:#101820;
  --accent-soft:#243746;
  --border:#303943;
  --border-strong:#414d59;
  --danger:#d87878;
  --success:#72b293;
}

*{box-sizing:border-box}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  padding:32px 22px 64px;
  -webkit-font-smoothing:antialiased;
}

::selection{
  background:#dce8f1;
  color:var(--ink);
}

.shell{
  max-width:1180px;
  margin:0 auto;
}

.pagehead{
  margin-bottom:24px;
  padding-left:2px;
}

h1{
  font-size:1.55rem;
  margin:0 0 5px;
  font-weight:700;
  letter-spacing:-.025em;
  color:var(--ink);
}

.sub{
  color:var(--muted);
  font-size:.88rem;
}

.layout{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
  align-items:start;
}

@media (min-width:900px){
  .layout{
    grid-template-columns:330px 1fr;
    gap:24px;
  }
  .side{
    position:sticky;
    top:22px;
  }
}

.main-col{
  display:flex;
  flex-direction:column;
  gap:18px;
  min-width:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:21px;
  box-shadow:0 2px 10px rgba(25,42,58,.035);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

@media (max-width:520px){
  .grid{grid-template-columns:1fr;}
  body{padding:24px 14px 48px;}
  .card{padding:17px;}
}

label{
  display:block;
  font-size:.77rem;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--muted);
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#fbfcfd;
  color:var(--ink);
  font-family:var(--font);
  font-size:.9rem;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}

:root[data-theme="dark"] input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea{
  background:#181e25;
}

input:hover,select:hover,textarea:hover{
  border-color:var(--border-strong);
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  background:var(--card);
  box-shadow:0 0 0 3px var(--accent-soft);
}

input[readonly]{
  opacity:.72;
  cursor:not-allowed;
  background:transparent;
}

textarea{
  resize:vertical;
  min-height:68px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

h2{
  font-size:.94rem;
  font-weight:700;
  color:var(--ink);
  border-bottom:1px solid var(--border);
  padding-bottom:11px;
  margin:0 0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  letter-spacing:.005em;
}

.session{
  border:1px solid var(--border);
    border-radius:9px;
  padding:15px 15px 13px;
  margin-bottom:11px;
  position:relative;
  background:#f9fafb;
}

:root[data-theme="dark"] .session{
  background:#181e25;
  }

.session:last-child{
  margin-bottom:0;
}

.session button.rm{
  position:absolute;
  top:10px;
  right:10px;
  background:none;
  border:none;
  color:var(--danger);
  cursor:pointer;
  font-family:var(--font);
  font-size:.76rem;
  font-weight:600;
  padding:3px 5px;
  border-radius:5px;
}

.session button.rm:hover{
  background:#f8eaea;
}

button{
  font-family:var(--font);
}

button.add{
  background:transparent;
  border:1px dashed var(--border-strong);
  color:var(--accent);
  border-radius:7px;
  padding:10px;
  width:100%;
  font-weight:600;
  cursor:pointer;
  font-size:.84rem;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}

button.add:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent-strong);
}

.btnrow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button.primary{
  background:var(--accent);
  color:var(--accent-ink);
  border:1px solid var(--accent);
  border-radius:7px;
  padding:10px 19px;
  font-weight:650;
  cursor:pointer;
  font-size:.88rem;
  transition:background .15s ease,border-color .15s ease,transform .1s ease;
}

button.primary:hover{
  background:var(--accent-strong);
  border-color:var(--accent-strong);
}

button.primary:active,
button.secondary:active{
  transform:translateY(1px);
}

button.secondary{
  background:var(--card);
  border:1px solid var(--border-strong);
  color:var(--ink);
  border-radius:7px;
  padding:10px 19px;
  font-weight:550;
  cursor:pointer;
  font-size:.88rem;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}

button.secondary:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-soft);
}

#editDetailsBtn{
  padding:5px 11px !important;
  font-size:.74rem !important;
  border-radius:6px;
}

#status{
  font-family:var(--font);
  font-size:.8rem;
  color:var(--muted);
  min-height:18px;
  padding-left:2px;
}

@media print{
  body{
    background:#fff;
    padding:0;
    color:#111;
  }

  .card{
    box-shadow:none;
    break-inside:avoid;
  }

  .btnrow,
  #status,
  .add,
  .rm,
  #editDetailsBtn{
    display:none !important;
  }

  .layout{
    display:block;
  }

  .side{
    position:static;
  }

  .main-col{
    display:block;
  }

  .card{
    margin-bottom:14px;
  }
}
</style>
</head>
<body>
<div class="shell">
<div class="pagehead">
  <h1>Teaching &amp; Learning Report</h1>
  <div class="sub">Pilih pelajar sedia ada atau tambah baru, isi laporan bulanan.</div>
</div>

<div class="layout">
  <div class="side">
    <div class="card">
      <h2>Pelajar &amp; Bulan <button class="secondary" id="editDetailsBtn" type="button">Edit Details</button></h2>
      <div class="field">
        <label>Pilih Pelajar Sedia Ada</label>
        <select id="studentPicker"><option value="">-- Pelajar Baru --</option></select>
      </div>
      <div class="field"><label>Nama Pelajar</label><input id="studentName"></div>
      <div class="field"><label>Umur / Tahun</label><input id="age" placeholder="cth: 14 Tahun"></div>
      <div class="field"><label>Nama Ibu Bapa</label><input id="parentName"></div>
      <div class="field"><label>No. Telefon Ibu Bapa</label><input id="parentPhone"></div>
      <div class="field"><label>Subjek</label><input id="subject" placeholder="cth: Mathematics DLP"></div>
      <div class="field"><label>Jadual</label><input id="schedule" placeholder="cth: Isnin (4pm - 5pm)"></div>
      <div class="field"><label>House / Location</label><input id="house"></div>
      <div class="field"><label>Nama Tutor</label><input id="tutorName"></div>
      <div class="field"><label>No. Telefon Tutor</label><input id="tutorPhone"></div>
      <div class="grid">
        <div class="field"><label>Bulan</label>
          <select id="month">
            <option value="" selected>-- Pilih Bulan --</option>
            <option value="1">Januari</option><option value="2">Februari</option><option value="3">Mac</option><option value="4">April</option>
            <option value="5">Mei</option><option value="6">Jun</option><option value="7">Julai</option><option value="8">Ogos</option>
            <option value="9">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Disember</option>
          </select>
        </div>
        <div class="field"><label>Tahun</label><input id="year" value="2026"></div>
      </div>
    </div>
  </div>

  <div class="main-col">
    <div class="card">
      <h2>Log Sesi</h2>
      <div id="sessions"></div>
      <button class="add" id="addSession" type="button">+ Tambah Sesi</button>
    </div>

    <div class="card">
      <h2>Ringkasan</h2>
      <div class="grid">
        <div class="field"><label>Rating</label><input id="rating" placeholder="cth: A / B / C"></div>
        <div class="field"><label>Monthly Test Result</label><input id="testResult"></div>
      </div>
      <div class="field"><label>Overall Performance &amp; Attitude</label><textarea id="overall"></textarea></div>
      <div class="field"><label>Student's Issue(s)</label><textarea id="issues"></textarea></div>
      <div class="field"><label>Action(s) To Be Taken</label><textarea id="actions"></textarea></div>
      <div class="field"><label>Guardian's Comment</label><textarea id="guardianComment"></textarea></div>
    </div>

    <div class="btnrow">
      <button class="primary" id="saveBtn" type="button">Simpan Laporan</button>
      <button class="secondary" id="printBtn" type="button">Cetak / PDF</button>
      <button class="secondary" id="exportBtn" type="button">Export ke Excel (.xlsx)</button>
      <button class="secondary" id="downloadHtmlBtn" type="button">Muat Turun (.html)</button>
      <button class="secondary" id="downloadDocBtn" type="button">Muat Turun Word (.doc)</button>
      <button class="secondary" id="downloadDocxBtn" type="button">Muat Turun Word (.docx)</button>
    </div>
    <div id="status">&nbsp;</div>
  </div>
</div>
</div>

<script>
let db=null, students={}, sessionCount=0;
const LOCK_FIELD_IDS=['studentName','age','parentName','parentPhone','subject','schedule','house','tutorName','tutorPhone','year'];
function lockFields(){ LOCK_FIELD_IDS.forEach(id=>{ document.getElementById(id).readOnly=true; }); document.getElementById('editDetailsBtn').textContent='Edit Details'; }
function unlockFields(){ LOCK_FIELD_IDS.forEach(id=>{ document.getElementById(id).readOnly=false; }); }
document.getElementById('editDetailsBtn').onclick=async (e)=>{
  const btn=e.target;
  if(btn.textContent==='Edit Details'){
    unlockFields();
    btn.textContent='Update';
    setStatus('Details boleh diedit sekarang.');
  } else {
    const name=document.getElementById('studentName').value.trim();
    if(!name){ setStatus('Sila isi nama pelajar dahulu.'); return; }
    lockFields();
    btn.textContent='Edit Details';
    setStatus('Menghantar details ke Google Sheet...');
    try{
      await sendToGoogleSheet({
        action:'updateHeader', studentName:name,
        parentName:document.getElementById('parentName').value,
        parentPhone:document.getElementById('parentPhone').value,
        age:document.getElementById('age').value,
        subject:document.getElementById('subject').value,
        schedule:document.getElementById('schedule').value,
        house:document.getElementById('house').value,
        tutorName:document.getElementById('tutorName').value,
        tutorPhone:document.getElementById('tutorPhone').value
      });
      setStatus('Details dihantar ke Google Sheet.');
      await loadStudentsFromSheet();
    }catch(err){
      setStatus('Gagal hantar details (mungkin dibuka via link Artifact, bukan fail download).');
    }
  }
};
const SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVoM7EWM_ZSHFtjew-v_lZ-TlKluSU0MOC0t3Ungb6TA-FmjUAU8StrUg_2ZLT6xfE/exec';

async function sendToGoogleSheet(payload){
  // no-cors + text/plain avoids a CORS preflight (Apps Script doesn't handle OPTIONS).
  // Response is opaque, so we can't confirm success/failure here — fire and forget.
  await fetch(SHEET_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
}

function sid(){return 's'+(sessionCount++);}
function addSessionRow(data){
  data=data||{};
  const id=sid();
  const wrap=document.createElement('div');
  wrap.className='session'; wrap.dataset.id=id;
  wrap.innerHTML=`
    <button class="rm" type="button" onclick="this.parentElement.remove()">Buang</button>
    <div class="grid">
      <div class="field"><label>Tarikh &amp; Masa</label><input class="s-date" value="${data.date||''}" placeholder="3/8/2026, 4pm - 5pm"></div>
      <div class="field"><label>Durasi (Jam)</label><input class="s-dur" value="${data.duration||''}" placeholder="1"></div>
    </div>
    <div class="field"><label>Topic Covered</label><textarea class="s-topic">${data.topic||''}</textarea></div>
    <div class="field"><label>Evaluation</label><textarea class="s-eval">${data.evaluation||''}</textarea></div>
  `;
  document.getElementById('sessions').appendChild(wrap);
}
document.getElementById('addSession').onclick=()=>addSessionRow();
addSessionRow();

function collectSessions(){
  return [...document.querySelectorAll('.session')].map(el=>({
    date: el.querySelector('.s-date').value,
    duration: el.querySelector('.s-dur').value,
    topic: el.querySelector('.s-topic').value,
    evaluation: el.querySelector('.s-eval').value
  }));
}
function setStatus(msg){document.getElementById('status').textContent=msg;}

function fillStudentFields(s){
  document.getElementById('studentName').value=s.name||'';
  document.getElementById('age').value=s.age||'';
  document.getElementById('parentName').value=s.parentName||'';
  document.getElementById('parentPhone').value=s.parentPhone||'';
  document.getElementById('subject').value=s.subject||'';
  document.getElementById('schedule').value=s.schedule||'';
  document.getElementById('house').value=s.house||'';
  document.getElementById('tutorName').value=s.tutorName||'';
  document.getElementById('tutorPhone').value=s.tutorPhone||'';
  lockFields();
}

async function loadStudents(){
  if(!db) return;
  try{
    const snap = await db.collection('students').get();
    const picker=document.getElementById('studentPicker');
    picker.innerHTML='<option value="">-- Pelajar Baru --</option>';
    students={};
    snap.docs.forEach(d=>{
      students[d.id]=d.data;
      const opt=document.createElement('option');
      opt.value=d.id; opt.textContent=d.data.name||d.id;
      picker.appendChild(opt);
    });
  }catch(e){ /* read may fail for view-only viewers */ }
}

function clearForm(){
  ['studentName','age','parentName','parentPhone','subject','schedule','house','tutorName','tutorPhone',
   'overall','rating','testResult','issues','actions','guardianComment'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('sessions').innerHTML='';
  addSessionRow();
  currentStudentMonths=[];
  unlockFields();
  setStatus('Borang dikosongkan untuk pelajar baru.');
}

document.getElementById('studentPicker').onchange=async (e)=>{
  const val=e.target.value;
  if(!val){ clearForm(); return; }
  if(students[val]){ fillStudentFields(students[val]); return; }
  setStatus('Memuat maklumat pelajar dari Google Sheet...');
  try{
    const res = await fetch(SHEET_SCRIPT_URL+'?action=student&name='+encodeURIComponent(val));
    const data = await res.json();
    if(data.status!=='ok'){ setStatus(data.message||'Gagal muat data pelajar.'); return; }
    fillStudentFields({
      name:data.header.studentName, age:data.header.age, parentName:data.header.parentName,
      parentPhone:data.header.parentPhone, subject:data.header.subject, schedule:data.header.schedule,
      house:data.header.house, tutorName:data.header.tutorName, tutorPhone:data.header.tutorPhone
    });
    currentStudentMonths = data.months||[];
    applyMonthData();
    setStatus('Maklumat pelajar dimuatkan.');
  }catch(err){
    setStatus('Gagal sambung ke Google Sheet (mungkin dibuka via link Artifact, bukan fail download).');
  }
};

let currentStudentMonths=[];
function findMonthEntry(){
  const y=document.getElementById('year').value, m=document.getElementById('month').value;
  return currentStudentMonths.find(x=>String(x.year)===String(y) && String(x.month)===String(m));
}
function applyMonthData(){
  const entry=findMonthEntry();
  document.getElementById('sessions').innerHTML='';
  const sess = entry ? entry.sessions : [];
  if(sess.length) sess.forEach(s=>addSessionRow(s)); else addSessionRow();
  document.getElementById('overall').value = entry ? entry.overall : '';
  document.getElementById('rating').value = entry ? entry.rating : '';
  document.getElementById('testResult').value = entry ? entry.testResult : '';
  document.getElementById('issues').value = entry ? entry.issues : '';
  document.getElementById('actions').value = entry ? entry.actions : '';
  document.getElementById('guardianComment').value = entry ? entry.guardianComment : '';
  setStatus(entry ? 'Data sedia ada untuk bulan ini dimuatkan.' : 'Belum ada data untuk bulan ini — borang kosong.');
}
document.getElementById('month').addEventListener('change', ()=>{ if(currentStudentMonths.length) applyMonthData(); });
document.getElementById('year').addEventListener('change', ()=>{ if(currentStudentMonths.length) applyMonthData(); });

async function loadStudentsFromSheet(){
  try{
    const res = await fetch(SHEET_SCRIPT_URL+'?action=list');
    const data = await res.json();
    if(data.status==='ok' && Array.isArray(data.students)){
      const picker=document.getElementById('studentPicker');
      const prevValue=picker.value;
      // Buang option lama yang datang dari Sheet (ditanda data-src="sheet") supaya tak double
      // bila function ni dipanggil berkali-kali (init, lepas Update, lepas Save).
      [...picker.querySelectorAll('option[data-src="sheet"]')].forEach(o=>o.remove());
      const existingValues = new Set([...picker.options].map(o=>o.value));
      data.students.filter(nm=>nm!=='TEMPLATE' && !existingValues.has(nm)).forEach(nm=>{
        const opt=document.createElement('option');
        opt.value=nm; opt.textContent=nm; opt.dataset.src='sheet';
        picker.appendChild(opt);
      });
      if(prevValue) picker.value=prevValue; // kekalkan pilihan semasa selepas refresh senarai
    }
  }catch(e){ /* artifact context or offline — ignore */ }
}

document.getElementById('saveBtn').onclick=async ()=>{
  const name=document.getElementById('studentName').value.trim();
  if(!name){ setStatus('Sila isi nama pelajar dahulu.'); return; }
  if(!document.getElementById('month').value){ setStatus('Sila pilih bulan dahulu.'); return; }
  const studentData={
    name, age:document.getElementById('age').value,
    parentName:document.getElementById('parentName').value,
    parentPhone:document.getElementById('parentPhone').value,
    subject:document.getElementById('subject').value,
    schedule:document.getElementById('schedule').value,
    house:document.getElementById('house').value,
    tutorName:document.getElementById('tutorName').value,
    tutorPhone:document.getElementById('tutorPhone').value
  };
  const report={
    ...studentData,
    month:document.getElementById('month').value,
    year:document.getElementById('year').value,
    sessions:collectSessions(),
    overall:document.getElementById('overall').value,
    rating:document.getElementById('rating').value,
    testResult:document.getElementById('testResult').value,
    issues:document.getElementById('issues').value,
    actions:document.getElementById('actions').value,
    guardianComment:document.getElementById('guardianComment').value,
    savedAt:Date.now()
  };
  setStatus('Menyimpan...');

  // 1) Simpan ke storan borang (dropdown pelajar) — hanya jalan bila dibuka via link Artifact.
  if(db){
    try{
      const picker=document.getElementById('studentPicker');
      let studentId=picker.value;
      if(studentId){
        await db.doc('students/'+studentId).update(studentData);
      } else {
        const ref = await db.collection('students').add(studentData);
        studentId = ref.id;
      }
      await db.collection('reports').add({...report, studentId});
      await loadStudents();
    }catch(err){ /* diteruskan ke Google Sheet walaupun ini gagal */ }
  }

  // 2) Hantar ke Google Sheet — hanya jalan bila dibuka sebagai fail HTML yang didownload.
  try{
    await sendToGoogleSheet({studentName:name, year:report.year, month:report.month, sessions:report.sessions,
      overall:report.overall, rating:report.rating, testResult:report.testResult, issues:report.issues,
      actions:report.actions, guardianComment:report.guardianComment});
    setStatus('Laporan dihantar. (Semak tab "'+name+'" dalam Google Sheet untuk sahkan.)');
    await loadStudentsFromSheet();
    if(document.getElementById('studentPicker').value) lockFields();
  }catch(err){
    setStatus('Laporan disimpan dalam borang, tapi hantar ke Google Sheet gagal (mungkin dibuka via link Artifact).');
  }
};

document.getElementById('printBtn').onclick=()=>window.print();

function currentReportRow(){
  const sessions=collectSessions();
  return {
    Bulan:document.getElementById('month').value,
    Tahun:document.getElementById('year').value,
    'Nama Pelajar':document.getElementById('studentName').value,
    'Umur/Tahun':document.getElementById('age').value,
    'Nama Ibu Bapa':document.getElementById('parentName').value,
    'No. Telefon Ibu Bapa':document.getElementById('parentPhone').value,
    Subjek:document.getElementById('subject').value,
    Jadual:document.getElementById('schedule').value,
    'House/Location':document.getElementById('house').value,
    'Nama Tutor':document.getElementById('tutorName').value,
    'No. Telefon Tutor':document.getElementById('tutorPhone').value,
    'Log Sesi':sessions.map(s=>`${s.date} | ${s.duration}j | ${s.topic} => ${s.evaluation}`).join(' || '),
    'Overall Performance & Attitude':document.getElementById('overall').value,
    Rating:document.getElementById('rating').value,
    'Monthly Test Result':document.getElementById('testResult').value,
    "Student's Issue(s)":document.getElementById('issues').value,
    'Action(s) To Be Taken':document.getElementById('actions').value,
    "Guardian's Comment":document.getElementById('guardianComment').value
  };
}

function loadXLSXLib(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX){resolve();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=resolve; s.onerror=()=>reject(new Error('Gagal muat library Excel'));
    document.head.appendChild(s);
  });
}

async function saveWorkbookFile(wb, filename){
  const bytes = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  let downloads=null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads=null; }
  if(downloads){
    await downloads.save({filename, data:new Blob([bytes],{type:'application/octet-stream'})});
    return;
  }
  const blob=new Blob([bytes],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}

document.getElementById('exportBtn').onclick=async ()=>{
  try{
    setStatus('Menyediakan fail Excel...');
    await loadXLSXLib();
    let rows=[];
    if(db){
      try{
        const snap = await db.collection('reports').get();
        rows = snap.docs.map(d=>{
          const r=d.data;
          return {
            Bulan:r.month, Tahun:r.year, 'Nama Pelajar':r.name, 'Umur/Tahun':r.age,
            'Nama Ibu Bapa':r.parentName, 'No. Telefon Ibu Bapa':r.parentPhone,
            Subjek:r.subject, Jadual:r.schedule, 'House/Location':r.house,
            'Nama Tutor':r.tutorName, 'No. Telefon Tutor':r.tutorPhone,
            'Log Sesi':(r.sessions||[]).map(s=>`${s.date} | ${s.duration}j | ${s.topic} => ${s.evaluation}`).join(' || '),
            'Overall Performance & Attitude':r.overall, Rating:r.rating,
            'Monthly Test Result':r.testResult, "Student's Issue(s)":r.issues,
            'Action(s) To Be Taken':r.actions, "Guardian's Comment":r.guardianComment
          };
        });
      }catch(e){ rows=[]; }
    }
    if(rows.length===0) rows=[currentReportRow()];
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'T&L Reports');
    await saveWorkbookFile(wb,'TL_Report_'+Date.now()+'.xlsx');
    setStatus('Fail Excel sedia untuk dimuat turun.');
  }catch(err){
    setStatus('Gagal export: '+(err&&err.message?err.message:'ralat'));
  }
};

async function saveGeneratedFile(blob, filename){
  let downloads=null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads=null; }
  if(downloads){ await downloads.save({filename, data:blob}); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}

const MONTH_NAMES=['','Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escNl(s){ return esc(s).replace(/\r\n|\r|\n/g,'<br>'); }

function reportSnapshot(){
  const g=id=>document.getElementById(id).value;
  return {
    monthName: MONTH_NAMES[parseInt(g('month')||'0',10)]||'', year:g('year'),
    studentName:g('studentName'), age:g('age'), parentName:g('parentName'), parentPhone:g('parentPhone'),
    subject:g('subject'), schedule:g('schedule'), house:g('house'), tutorName:g('tutorName'), tutorPhone:g('tutorPhone'),
    sessions:collectSessions(), overall:g('overall'), rating:g('rating'), testResult:g('testResult'),
    issues:g('issues'), actions:g('actions'), guardianComment:g('guardianComment')
  };
}

// Bina badan laporan sebagai HTML (dikongsi oleh versi .html dan .doc)
function buildReportHTML(r){
  const sessRows=(r.sessions.length?r.sessions:[{date:'',duration:'',topic:'',evaluation:''}])
    .map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.duration)}</td><td>${escNl(s.topic)}</td><td>${escNl(s.evaluation)}</td></tr>`).join('');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>T&amp;L Report - ${esc(r.studentName)}</title>
<style>
*{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;}
body{color:#111;margin:36pt;}
h1{text-align:center;margin:0 0 4pt;font-weight:bold;}
.sub{text-align:center;font-weight:bold;margin:0 0 16pt;}
table{border-collapse:collapse;width:100%;margin-bottom:14pt;}
td,th{border:1px solid #000;padding:7pt 8pt 7pt 11pt;vertical-align:top;}
.lbl{font-weight:bold;background:#f2f2f2;width:32%;}
th{font-weight:bold;background:#f2f2f2;}
.sig{margin-top:26pt;}
.sig p{margin:0 0 6pt;}
</style></head><body>
<div style="display:flex;align-items:center;gap:14pt;margin-bottom:16pt;">
<img src="data:image/png;base64,${LOGO_B64}" style="width:110pt;height:auto;flex:0 0 auto;">
<div style="flex:1;">
<h1>TEACHING &amp; LEARNING REPORT (T&amp;L)</h1>
<div class="sub">MONTH: ${esc(r.monthName)} &nbsp; YEAR: ${esc(r.year)}</div>
</div>
</div>
<table>
<tr><td class="lbl">PARENT'S NAME</td><td>${esc(r.parentName)}</td></tr>
<tr><td class="lbl">PHONE NO.</td><td>${esc(r.parentPhone)}</td></tr>
<tr><td class="lbl">STUDENT'S NAME</td><td>${esc(r.studentName)}</td></tr>
<tr><td class="lbl">AGE</td><td>${esc(r.age)}</td></tr>
<tr><td class="lbl">SUBJECT(S)</td><td>${esc(r.subject)}</td></tr>
<tr><td class="lbl">SCHEDULE(S)</td><td>${esc(r.schedule)}</td></tr>
<tr><td class="lbl">HOUSE / LOCATION</td><td>${esc(r.house)}</td></tr>
<tr><td class="lbl">TUTOR'S NAME</td><td>${esc(r.tutorName)}</td></tr>
<tr><td class="lbl">TUTOR'S PHONE NO.</td><td>${esc(r.tutorPhone)}</td></tr>
</table>
<table><colgroup><col style="width:20%"><col style="width:12%"><col style="width:34%"><col style="width:34%"></colgroup><tr><th>DATE &amp; TIME</th><th>DURATION (HOURS)</th><th>TOPIC COVERED</th><th>EVALUATION</th></tr>${sessRows}</table>
<table>
<tr><td class="lbl">OVERALL PERFORMANCE &amp; ATTITUDE</td><td>${escNl(r.overall)}</td></tr>
<tr><td class="lbl">RATING</td><td>${esc(r.rating)}</td></tr>
<tr><td class="lbl">MONTHLY TEST RESULT</td><td>${esc(r.testResult)}</td></tr>
<tr><td class="lbl">STUDENT'S ISSUE(S)</td><td>${escNl(r.issues)}</td></tr>
<tr><td class="lbl">ACTION(S) TO BE TAKEN</td><td>${escNl(r.actions)}</td></tr>
<tr><td class="lbl">GUARDIAN'S COMMENT</td><td>${escNl(r.guardianComment)}</td></tr>
</table>
<div class="sig">
<p>Tutor Signature: _____&nbsp;&nbsp;&nbsp;&nbsp;Guardian's Signature: __________&nbsp;&nbsp;&nbsp;Manager Signature: _______&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Date:______</p>
</div>
</body></html>`;
}

function reportFilename(r, ext){
  const safe=(r.studentName||'Report').replace(/[^a-z0-9]+/gi,'_');
  return `TL_${safe}_${r.monthName||''}${r.year||''}.${ext}`;
}

document.getElementById('downloadHtmlBtn').onclick=async()=>{
  const r=reportSnapshot();
  const blob=new Blob([buildReportHTML(r)],{type:'text/html'});
  await saveGeneratedFile(blob, reportFilename(r,'html'));
  setStatus('Fail HTML sedia untuk dimuat turun.');
};

document.getElementById('downloadDocBtn').onclick=async()=>{
  const r=reportSnapshot();
  // Trik .doc klasik: HTML dengan xmlns Word, disimpan sebagai application/msword.
  // Word buka & format ini terus (jadual, bold, dll kekal) — tiada perisian luar/AI diperlukan.
  const head=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">`;
  const html=buildReportHTML(r).replace('<!DOCTYPE html><html>', head);
  const blob=new Blob(['\ufeff', html],{type:'application/msword'});
  await saveGeneratedFile(blob, reportFilename(r,'doc'));
  setStatus('Fail .doc sedia untuk dimuat turun (buka terus dalam Word).');
};

document.getElementById('downloadDocxBtn').onclick=async()=>{
  const btn=document.getElementById('downloadDocxBtn');
  btn.disabled=true; setStatus('Menjana .docx sebenar...');
  try{
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType, ImageRun } =
      await import('https://esm.sh/docx@8.5.0');
    const r=reportSnapshot();
    const TABLE_W=9026;
    const line={style:BorderStyle.SINGLE,size:4,color:'000000'};
    const borders={top:line,bottom:line,left:line,right:line,insideHorizontal:line,insideVertical:line};
    const cellMargins={top:80,bottom:80,left:140,right:100};
    const cell=(text,opts)=>{
      const lines=String(text==null?'':text).split(/\r\n|\r|\n/);
      return new TableCell({width:{size:opts.w,type:WidthType.DXA},shading:opts.head?{fill:'F2F2F2'}:undefined,margins:cellMargins,
        children:lines.map(line=>new Paragraph({children:[new TextRun({text:line,bold:!!opts.head})]}))});
    };

    const infoRows=[
      ['PARENT\'S NAME',r.parentName],['PHONE NO.',r.parentPhone],['STUDENT\'S NAME',r.studentName],
      ['AGE',r.age],['SUBJECT(S)',r.subject],['SCHEDULE(S)',r.schedule],['HOUSE / LOCATION',r.house],
      ['TUTOR\'S NAME',r.tutorName],['TUTOR\'S PHONE NO.',r.tutorPhone]
    ].map(([lbl,val])=>new TableRow({children:[cell(lbl,{w:2890,head:true}),cell(val,{w:6136,head:false})]}));
    const infoTable=new Table({width:{size:TABLE_W,type:WidthType.DXA},columnWidths:[2890,6136],borders,rows:infoRows});

    const sess=r.sessions.length?r.sessions:[{date:'',duration:'',topic:'',evaluation:''}];
    const sW=[1800,1100,3060,3066];
    const sessHead=new TableRow({children:['DATE & TIME','DURATION (HOURS)','TOPIC COVERED','EVALUATION'].map((t,i)=>cell(t,{w:sW[i],head:true}))});
    const sessRows=sess.map(s=>new TableRow({children:[cell(s.date,{w:sW[0]}),cell(s.duration,{w:sW[1]}),cell(s.topic,{w:sW[2]}),cell(s.evaluation,{w:sW[3]})]}));
    const sessTable=new Table({width:{size:TABLE_W,type:WidthType.DXA},columnWidths:sW,borders,rows:[sessHead,...sessRows]});

    const summaryRows=[
      ['OVERALL PERFORMANCE & ATTITUDE',r.overall],['RATING',r.rating],['MONTHLY TEST RESULT',r.testResult],
      ["STUDENT'S ISSUE(S)",r.issues],['ACTION(S) TO BE TAKEN',r.actions],["GUARDIAN'S COMMENT",r.guardianComment]
    ].map(([lbl,val])=>new TableRow({children:[cell(lbl,{w:2890,head:true}),cell(val,{w:6136,head:false})]}));
    const summaryTable=new Table({width:{size:TABLE_W,type:WidthType.DXA},columnWidths:[2890,6136],borders,rows:summaryRows});

    const noLine={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
    const noBorders={top:noLine,bottom:noLine,left:noLine,right:noLine,insideHorizontal:noLine,insideVertical:noLine};
    const logoBin=atob(LOGO_B64);
    const logoBytes=new Uint8Array(logoBin.length);
    for(let i=0;i<logoBin.length;i++) logoBytes[i]=logoBin.charCodeAt(i);
    const headerTable=new Table({width:{size:TABLE_W,type:WidthType.DXA},columnWidths:[2400,6626],borders:noBorders,rows:[new TableRow({children:[
      new TableCell({width:{size:2400,type:WidthType.DXA},children:[new Paragraph({children:[new ImageRun({data:logoBytes,transformation:{width:110,height:51},type:'png'})]})]}),
      new TableCell({width:{size:6626,type:WidthType.DXA},verticalAlign:'center',children:[
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:80},children:[new TextRun({text:'TEACHING & LEARNING REPORT (T&L)',bold:true,size:28})]}),
        new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:`MONTH: ${r.monthName}   YEAR: ${r.year}`,bold:true})]})
      ]})
    ]})]});

    const doc=new Document({
      styles:{default:{document:{run:{font:'Calibri',size:21}}}},
      sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1440,bottom:1440,left:1440,right:1440}}},children:[
        headerTable, new Paragraph({spacing:{after:120},children:[]}),
        infoTable, new Paragraph({spacing:{after:200},children:[]}),
        sessTable, new Paragraph({spacing:{after:200},children:[]}),
        summaryTable, new Paragraph({spacing:{after:200},children:[]}),
        new Paragraph({spacing:{before:300},children:[new TextRun({text:'Tutor Signature: _____    Guardian\'s Signature: __________   Manager Signature: _______     Date:______'})]})
      ]}]
    });
    const blob=await Packer.toBlob(doc);
    await saveGeneratedFile(blob, reportFilename(r,'docx'));
    setStatus('Fail .docx sedia untuk dimuat turun.');
  }catch(err){
    console.error(err);
    setStatus('Gagal jana .docx ('+(err&&err.message?err.message:'ralat')+'). Cuba .doc sebagai ganti.');
  }finally{ btn.disabled=false; }
};
